<script>
const SUPABASE_URL = "https://tzgmkqqtjnwgacipenmz.supabase.co";
const SUPABASE_KEY = "sb_publishable_pboaiePYU0TUqudEkNJHPw_hZE94vXo";
const TABLE = "cards";

// ===== Supabase =====
async function dbSelect(params) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}${params}`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
}
async function dbInsertBatch(rows) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=minimal" },
        body: JSON.stringify(rows)
    });
    if (!res.ok) throw new Error(await res.text());
}
async function dbCount() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=id`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Prefer": "count=exact", "Range": "0-0" }
    });
    const match = (res.headers.get("content-range") || "").match(/\/(\d+)/);
    return match ? Number(match[1]) : 0;
}

// ===== 警句 =====
const quotes = [
    "是日已过，命亦随减。","生死事大，无常迅速。","莫待老来方学道。",
    "但行好事，莫问前程。","命由我作，福自己求。","静坐常思己过，闲谈莫论人非。",
    "一切有为法，如梦幻泡影。","过去心不可得，现在心不可得，未来心不可得。",
    "学如逆水行舟，不进则退。","知行合一，事上磨练。","人若改过，自有吉祥。","凡事预则立，不预则废。"
];

// ===== 状态 =====
let cards = [];
let currentIndex = 0;

// ===== 元素 =====
const splashScreen   = document.getElementById("splash-screen");
const loadingScreen  = document.getElementById("loading-screen");
const mainApp        = document.getElementById("main-app");
const quoteText      = document.getElementById("quote-text");
const enterBtn       = document.getElementById("enter-btn");
const cardContainer  = document.getElementById("card-container");
const cardContent    = document.getElementById("card-content");
const bookLabel      = document.getElementById("bookLabel");
const cardCounter    = document.getElementById("card-counter");
const emptyState     = document.getElementById("empty-state");
const starBtn        = document.getElementById("starBtn");
const randomBtn      = document.getElementById("randomBtn");
const prevBtn        = document.getElementById("prevBtn");
const nextBtn        = document.getElementById("nextBtn");
const searchInput    = document.getElementById("searchInput");
const favBtn         = document.getElementById("favBtn");
const favPanel       = document.getElementById("fav-panel");
const favList        = document.getElementById("fav-list");
const closeFavBtn    = document.getElementById("closeFavBtn");
const searchPanel    = document.getElementById("search-panel");
const searchList     = document.getElementById("search-list");
const searchTitle    = document.getElementById("search-title");
const closeSearchBtn = document.getElementById("closeSearchBtn");
const adminBtn       = document.getElementById("adminBtn");
const adminPanel     = document.getElementById("admin-panel");
const closeAdminBtn  = document.getElementById("closeAdminBtn");
const fileInput      = document.getElementById("file-input");
const uploadArea     = document.getElementById("upload-area");
const bookNameInput  = document.getElementById("bookNameInput");
const answererInput  = document.getElementById("answererInput");
const chunkSizeInput = document.getElementById("chunkSizeInput");
const uploadBtn      = document.getElementById("uploadBtn");
const uploadLog      = document.getElementById("upload-log");
const checkDbBtn     = document.getElementById("checkDbBtn");
const dbStatus       = document.getElementById("db-status");
const modeQA         = document.getElementById("modeQA");
const modePara       = document.getElementById("modePara");
const qaFields       = document.getElementById("qa-fields");
const paraFields     = document.getElementById("para-fields");

// ===== 开屏 =====
quoteText.textContent = quotes[Math.floor(Math.random() * quotes.length)];

// ===== 收藏 =====
function getFavs() { try { return JSON.parse(localStorage.getItem("favorites") || "[]"); } catch(e) { return []; } }
function saveFavs(f) { try { localStorage.setItem("favorites", JSON.stringify(f)); } catch(e) {} }
function isFav(card) { return getFavs().some(f => f.id === card.id); }

// ===== 渲染卡片 =====
function renderCard() {
    if (cards.length === 0) {
        cardContainer.style.display = "none";
        emptyState.classList.add("show");
        cardCounter.textContent = "";
        return;
    }
    cardContainer.style.display = "flex";
    emptyState.classList.remove("show");
    if (currentIndex < 0) currentIndex = cards.length - 1;
    if (currentIndex >= cards.length) currentIndex = 0;
    const card = cards[currentIndex];
    bookLabel.textContent = card.book || "";
    cardContent.textContent = card.content || "";
    cardCounter.textContent = (currentIndex + 1) + " / " + cards.length;
    starBtn.textContent = isFav(card) ? "★" : "☆";
    isFav(card) ? starBtn.classList.add("active") : starBtn.classList.remove("active");
    try { localStorage.setItem("reading-progress", currentIndex); } catch(e) {}
}

// ===== 加载卡片 =====
async function loadCards() {
    loadingScreen.classList.add("show");
    try {
        let all = [], from = 0;
        while (true) {
            const chunk = await dbSelect(`?select=id,book,content&order=id.asc&offset=${from}&limit=1000`);
            all = all.concat(chunk);
            if (chunk.length < 1000) break;
            from += 1000;
        }
        cards = all;
        try {
            const saved = Number(localStorage.getItem("reading-progress") || 0);
            currentIndex = (saved >= 0 && saved < cards.length) ? saved : 0;
        } catch(e) { currentIndex = 0; }
    } catch(e) { cards = []; }
    loadingScreen.classList.remove("show");
}

// ===== 进入阅读 =====
enterBtn.addEventListener("click", async () => {
    splashScreen.style.display = "none";
    mainApp.style.display = "flex";
    await loadCards();
    renderCard();
});

// ===== 翻页 =====
nextBtn.addEventListener("click", () => { currentIndex++; renderCard(); });
prevBtn.addEventListener("click", () => { currentIndex--; renderCard(); });
randomBtn.addEventListener("click", () => {
    if (!cards.length) return;
    currentIndex = Math.floor(Math.random() * cards.length);
    renderCard();
});

// ===== 滑动手势 =====
let tx = 0, ty = 0;
cardContainer.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cardContainer.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 40) { dx < 0 ? currentIndex++ : currentIndex--; renderCard(); }
    } else {
        if (Math.abs(dy) > 40) { dy < 0 ? currentIndex++ : currentIndex--; renderCard(); }
    }
}, { passive: true });

// ===== 收藏 =====
starBtn.addEventListener("click", () => {
    if (!cards.length) return;
    const card = cards[currentIndex];
    let favs = getFavs();
    saveFavs(isFav(card) ? favs.filter(f => f.id !== card.id) : [...favs, card]);
    renderCard();
});
favBtn.addEventListener("click", () => { renderFavPanel(); favPanel.classList.add("open"); });
closeFavBtn.addEventListener("click", () => favPanel.classList.remove("open"));
function renderFavPanel() {
    const favs = getFavs();
    favList.innerHTML = "";
    if (!favs.length) { favList.innerHTML = '<div class="empty-tip">还没有收藏<br>阅读时点击 ☆ 收藏卡片</div>'; return; }
    favs.forEach(card => {
        const div = document.createElement("div");
        div.className = "fav-card";
        div.innerHTML = `<div class="book-label">${card.book||""}</div><div class="fav-content">${card.content||""}</div><button class="fav-remove" data-id="${card.id}">移除收藏</button>`;
        favList.appendChild(div);
    });
    favList.querySelectorAll(".fav-remove").forEach(btn => {
        btn.addEventListener("click", () => {
            saveFavs(getFavs().filter(f => f.id !== Number(btn.dataset.id)));
            renderFavPanel(); renderCard();
        });
    });
}

// ===== 搜索 =====
searchInput.addEventListener("input", () => {
    const kw = searchInput.value.trim();
    if (!kw) { searchPanel.classList.remove("open"); return; }
    const results = cards.filter(c => c.content.includes(kw) || (c.book && c.book.includes(kw)));
    searchTitle.textContent = `"${kw}"  ·  ${results.length} 条`;
    searchList.innerHTML = "";
    if (!results.length) { searchList.innerHTML = '<div class="empty-tip">未找到相关内容</div>'; }
    else {
        results.forEach(card => {
            const div = document.createElement("div");
            div.className = "search-card";
            div.innerHTML = `<div class="book-label">${card.book||""}</div><div class="search-content">${card.content||""}</div>`;
            div.addEventListener("click", () => {
                currentIndex = cards.findIndex(c => c.id === card.id);
                renderCard(); searchPanel.classList.remove("open"); searchInput.value = "";
            });
            searchList.appendChild(div);
        });
    }
    searchPanel.classList.add("open");
});
closeSearchBtn.addEventListener("click", () => { searchPanel.classList.remove("open"); searchInput.value = ""; });

// ===== 管理员 =====
adminBtn.addEventListener("click", () => adminPanel.classList.add("open"));
closeAdminBtn.addEventListener("click", () => adminPanel.classList.remove("open"));

// 切分模式切换
let currentMode = "qa";
modeQA.addEventListener("click", () => {
    currentMode = "qa";
    modeQA.classList.add("active"); modePara.classList.remove("active");
    qaFields.style.display = "block"; paraFields.style.display = "none";
});
modePara.addEventListener("click", () => {
    currentMode = "para";
    modePara.classList.add("active"); modeQA.classList.remove("active");
    paraFields.style.display = "block"; qaFields.style.display = "none";
});

// 文件选择
let selectedFile = null;
fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files[0];
    if (selectedFile) {
        uploadArea.innerHTML = `✅ 已选择：${selectedFile.name}<br><span style="font-size:12px;color:#bbb">点击重新选择</span>`;

    }

// ===== 切分逻辑：问答体 =====
function splitQA(text, answerer) {
    // 按行处理，识别"回答者名字："开头的段落
    const lines = text.split("\n");
    const cards = [];
    let currentCard = "";
    let inAnswer = false;

    // 用于判断是否是"某人："的行（问者或答者）
    // 回答者固定，问者是其他任何"名字："格式
    const answererPrefix = answerer + "：";
    const answererPrefixColon = answerer + ":"; // 兼容英文冒号

    function isAnswererLine(line) {
        return line.startsWith(answererPrefix) || line.startsWith(answererPrefixColon);
    }

    function isQuestionLine(line) {
        // 排除章节标题、页码、空行
        if (!line.trim()) return false;
        if (/^第\s*\d+\s*[章节]/.test(line)) return false;
        if (/^\d+$/.test(line.trim())) return false;
        // 判断是否有"名字："格式（不是回答者）
        const colonIdx = Math.max(line.indexOf("："), line.indexOf(":"));
        if (colonIdx > 0 && colonIdx <= 20 && !isAnswererLine(line)) {
            const prefix = line.substring(0, colonIdx);
            // 排除常见非人名的情况
            if (!/第|节|章|http|www/.test(prefix)) return true;
        }
        return false;
    }

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        // 跳过页眉页脚（书名重复行、纯数字页码）
        if (/^坐禅之问答录$/.test(line)) continue;
        if (/^\d{1,3}$/.test(line)) continue;

        if (isQuestionLine(line)) {
            // 遇到新问题，先保存上一张卡片
            if (currentCard.trim()) {
                cards.push(currentCard.trim());
            }
            currentCard = line + "\n";
            inAnswer = false;
        } else if (isAnswererLine(line)) {
            currentCard += "\n" + line + "\n";
            inAnswer = true;
        } else {
            // 续行，追加到当前卡片
            currentCard += line + "\n";
        }
    }
    if (currentCard.trim()) cards.push(currentCard.trim());

    // 过滤掉太短的（不足20字，可能是噪音）
    return cards.filter(c => c.length >= 20);
}

// ===== 切分逻辑：普通段落 =====
function splitPara(text, chunkSize) {
    const paras = text.split(/\n+/).map(p => p.trim()).filter(p => p.length > 10);
    const chunks = [];
    let current = "";
    for (const para of paras) {
        if (para.length >= chunkSize) {
            if (current.trim()) { chunks.push(current.trim()); current = ""; }
            for (let i = 0; i < para.length; i += chunkSize) chunks.push(para.slice(i, i + chunkSize));
        } else if ((current + para).length > chunkSize) {
            if (current.trim()) chunks.push(current.trim());
            current = para;
        } else {
            current = current ? current + "\n" + para : para;
        }
    }
    if (current.trim()) chunks.push(current.trim());
    return chunks;
}

function log(msg, type = "") {
    const div = document.createElement("div");
    div.className = type;
    div.textContent = msg;
    uploadLog.appendChild(div);
    uploadLog.scrollTop = uploadLog.scrollHeight;
}

uploadBtn.addEventListener("click", async () => {
    if (!selectedFile) return;
    const bookName = bookNameInput.value.trim();
    if (!bookName) { alert("请先填写书名"); return; }

    if (currentMode === "qa" && !answererInput.value.trim()) {
        alert("问答模式请填写回答者名字");
        return;
    }

    uploadBtn.disabled = true;
    uploadLog.innerHTML = "";
    log("正在读取文件…");

    const text = await selectedFile.text();
    let chunks;

    if (currentMode === "qa") {
        const answerer = answererInput.value.trim();
        log(`识别回答者：${answerer}，开始切分问答…`);
        chunks = splitQA(text, answerer);
    } else {
        const chunkSize = Math.max(50, Math.min(600, Number(chunkSizeInput.value) || 200));
        log(`按段落切分，每卡约 ${chunkSize} 字…`);
        chunks = splitPara(text, chunkSize);
    }

    log(`共切出 ${chunks.length} 张卡片，开始上传…`);

    const batchSize = 100;
    let success = 0;
    for (let i = 0; i < chunks.length; i += batchSize) {
        const batch = chunks.slice(i, i + batchSize).map(content => ({ book: bookName, content }));
        try {
            await dbInsertBatch(batch);
            success += batch.length;
            log(`已上传 ${success} / ${chunks.length} 张…`);
        } catch(e) {
            log(`上传出错：${e.message}`, "log-err");
        }
    }

    log(`✅ 完成！共上传 ${success} 张卡片`, "log-ok");
    uploadBtn.disabled = false;
    await loadCards();
    renderCard();
});

checkDbBtn.addEventListener("click", async () => {
    dbStatus.textContent = "查询中…";
    try {
        const count = await dbCount();
        dbStatus.textContent = `数据库当前共有 ${count} 张卡片`;
    } catch(e) {
        dbStatus.textContent = "查询失败：" + e.message;
    }
});
</script>
