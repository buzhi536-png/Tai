<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>佛经碎片学习 · 沉浸简讯流</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #faf7f2;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #2e241f;
            height: 100vh;
            overflow: hidden;
        }
        /* 主应用容器 */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 700px;
            margin: 0 auto;
            background: #faf7f2;
            position: relative;
        }
        /* ========== 随机模式专用头部（极简） ========== */
        .random-header {
            flex-shrink: 0;
            padding: 12px 16px 8px;
            background: transparent;
            z-index: 10;
            transition: opacity 0.3s;
        }
        .random-header .banner {
            background: rgba(230, 213, 184, 0.9);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 30px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a3727;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .random-header .search-bar {
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 40px;
            margin-bottom: 8px;
        }
        .random-header .search-input {
            flex: 1;
            border: none;
            padding: 6px 0;
            font-size: 0.85rem;
            background: transparent;
            outline: none;
        }
        .random-header .search-btn, 
        .random-header .clear-search {
            background: #e0d6cc;
            border: none;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .random-header .tabs {
            display: flex;
            gap: 6px;
            background: rgba(240, 234, 226, 0.9);
            backdrop-filter: blur(4px);
            padding: 4px;
            border-radius: 48px;
        }
        .random-header .tab {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            color: #5a4a3a;
        }
        .random-header .tab.active {
            background: #ffffff;
            color: #b45f2b;
            font-weight: 600;
        }
        /* 随机模式下的主内容区（全屏卡片） */
        .random-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card-swipe-container {
            flex: 1;
            position: relative;
            touch-action: none;
            overflow: hidden;
        }
        .swipe-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), opacity 0.3s ease;
            will-change: transform, opacity;
        }
        .card-inner {
            background: white;
            border-radius: 36px;
            padding: 32px 28px;
            width: 100%;
            max-height: 80%;
            overflow-y: auto;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            border: 1px solid #ece1d4;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .card-question {
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 24px;
            color: #3e2a1f;
            padding-right: 48px;
        }
        .card-answer {
            font-size: 1.05rem;
            line-height: 1.65;
            color: #5a4a3a;
            white-space: pre-wrap;
        }
        .card-source {
            font-size: 0.75rem;
            color: #b8a88a;
            margin-top: 24px;
            padding-top: 12px;
            border-top: 1px solid #f0e8e0;
        }
        .swipe-fav-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            font-size: 1.9rem;
            cursor: pointer;
            color: #d4c0a8;
            transition: transform 0.2s ease;
            z-index: 2;
        }
        .swipe-fav-btn.active {
            color: #e67e22;
        }
        .swipe-fav-btn:active {
            transform: scale(0.9);
        }
        /* 底部提示条（可点击） */
        .swipe-hint {
            flex-shrink: 0;
            text-align: center;
            padding: 12px 0 20px;
            color: #bcae9a;
            font-size: 12px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: color 0.2s;
            background: #faf7f2;
        }
        .swipe-hint:active {
            color: #8e7a64;
        }
        /* 其他模式（收藏/搜索/功课）使用列表模式 */
        .list-mode {
            height: 100%;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            -webkit-overflow-scrolling: touch;
        }
        .list-mode .card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            position: relative;
        }
        .list-mode .question {
            font-size: 1.2rem;
            font-weight: 700;
            padding-right: 48px;
            margin-bottom: 12px;
        }
        .list-mode .answer {
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .list-mode .fav-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .list-mode .fav-btn.active { color: #e67e22; }
        .journal-area {
            background: white;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .journal-date {
            font-weight: 700;
            margin-bottom: 12px;
            color: #b45f2b;
        }
        .journal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6d9ce;
            border-radius: 24px;
            font-family: inherit;
            margin-bottom: 10px;
        }
        .journal-save {
            background: #e0d6cc;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
        }
        .history-item {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #eee3d8;
        }
        .history-date {
            font-size: 0.7rem;
            color: #a2856a;
        }
        .history-text {
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .edit-history {
            background: none;
            border: none;
            color: #b8a88a;
            margin-left: 8px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
        .status-message {
            text-align: center;
            padding: 12px;
            color: #b8a88a;
            font-size: 0.75rem;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #cbbc9f;
            padding: 10px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 随机模式专用头部（极简） -->
    <div id="randomHeader" class="random-header">
        <div class="banner" id="wisdomBanner">⚡ 加载中...</div>
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索佛经讲解...">
            <button id="searchBtn" class="search-btn">搜索</button>
            <button id="clearSearchBtn" class="clear-search" style="display: none;">返回</button>
        </div>
        <div class="tabs">
            <div class="tab active" data-mode="random">📖 随机推送</div>
            <div class="tab" data-mode="favorites">⭐ 我的收藏</div>
            <div class="tab" data-mode="journal">📝 修行功课</div>
        </div>
    </div>

    <!-- 随机模式内容区 -->
    <div id="randomContent" class="random-content">
        <div id="cardSwipeContainer" class="card-swipe-container"></div>
        <div id="swipeHint" class="swipe-hint">⬆️ 往上滑动 或 点击此处 查看下一条</div>
    </div>

    <!-- 列表模式容器（收藏、搜索结果、功课） -->
    <div id="listModeContainer" class="list-mode hidden">
        <div id="cardsContainer"></div>
        <div id="statusMessage" class="status-message"></div>
        <footer>🙏 精进不懈 · 随喜赞叹</footer>
    </div>
</div>

<script>
    // ---------- 1. 问答数据（示例）----------
    const sampleQA = [
        { id: "1", question: "什么是“色即是空”？", answer: "色指物质现象，空指无自性。一切物质都是因缘和合而生，没有永恒不变的实体。", source: "心经讲解" },
        { id: "2", question: "如何理解“放下”？", answer: "放下不是放弃，而是不执着。该做的事仍然做，但心里不挂碍结果。", source: "金刚经浅释" },
        { id: "3", question: "什么是“业力”？", answer: "业力是行为产生的潜在力量，善有善果，恶有恶报。", source: "因果道理" },
        { id: "4", question: "如何修“慈悲心”？", answer: "从理解他人痛苦开始，先对亲近的人修，再扩展到陌生人。", source: "四无量心" },
        { id: "5", question: "什么是“无我”？", answer: "没有一个独立、恒常的“我”，身心五蕴刹那生灭。", source: "阿含经" }
    ];
    let fullKnowledge = [...sampleQA];
    for (let i = 6; i <= 30; i++) {
        fullKnowledge.push({
            id: String(i),
            question: `佛学问答 ${i}：如何保持正念？`,
            answer: `正念就是活在当下，觉知身心现象。可以从呼吸开始练习。第${i}条示例内容，愿您法喜充满。`,
            source: "正念禅修"
        });
    }

    // ---------- 2. 全局状态 ----------
    let favoriteIds = new Set();
    let journalEntries = [];
    let currentDisplayMode = "random";   // random, favorites, search, journal
    let searchResults = [];

    // 随机队列数据（卡片对象数组，已打乱）
    let randomQueue = [];
    let currentCardIndex = 0;

    // DOM 元素
    const randomHeader = document.getElementById("randomHeader");
    const randomContent = document.getElementById("randomContent");
    const listModeContainer = document.getElementById("listModeContainer");
    const cardsContainer = document.getElementById("cardsContainer");
    const statusMsgDiv = document.getElementById("statusMessage");
    const swipeContainer = document.getElementById("cardSwipeContainer");
    const swipeHint = document.getElementById("swipeHint");

    // ---------- 3. 收藏功能 ----------
    function loadFavorites() {
        const stored = localStorage.getItem("buddha_favorites");
        if (stored) try { favoriteIds = new Set(JSON.parse(stored)); } catch(e) {}
    }
    function saveFavorites() {
        localStorage.setItem("buddha_favorites", JSON.stringify([...favoriteIds]));
    }
    function isFavorite(id) { return favoriteIds.has(id); }
    function addFavorite(id) {
        favoriteIds.add(id);
        saveFavorites();
        refreshCurrentView();
    }
    function removeFavorite(id) {
        favoriteIds.delete(id);
        saveFavorites();
        refreshCurrentView();
    }
    function toggleFavorite(id) {
        isFavorite(id) ? removeFavorite(id) : addFavorite(id);
    }

    // ---------- 4. 随机队列管理（打乱全部，循环）----------
    function rebuildRandomQueue() {
        const shuffled = [...fullKnowledge];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        randomQueue = shuffled;
        currentCardIndex = 0;
    }

    function ensureQueueValid() {
        if (randomQueue.length === 0) rebuildRandomQueue();
        if (currentCardIndex >= randomQueue.length) {
            rebuildRandomQueue();
            showToast("✨ 已看完一轮，开始新的一轮 ✨");
        }
    }

    function getCurrentCard() {
        ensureQueueValid();
        return randomQueue[currentCardIndex] || null;
    }

    // 切换到下一张（带动画过渡）
    let isAnimating = false;
    function nextCard() {
        if (isAnimating || currentDisplayMode !== "random") return;
        isAnimating = true;
        // 获取当前卡片元素
        const currentCardDiv = document.querySelector(".swipe-card");
        if (!currentCardDiv) {
            // 直接更新内容
            currentCardIndex++;
            ensureQueueValid();
            renderCurrentSwipeCard();
            isAnimating = false;
            return;
        }
        // 添加淡出+上移动画
        currentCardDiv.style.transition = "transform 0.3s ease, opacity 0.25s ease";
        currentCardDiv.style.transform = "translateY(-30px)";
        currentCardDiv.style.opacity = "0";
        
        setTimeout(() => {
            currentCardIndex++;
            ensureQueueValid();
            renderCurrentSwipeCard(true); // 重置新卡位置
            const newCard = document.querySelector(".swipe-card");
            if (newCard) {
                newCard.style.transition = "transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1), opacity 0.3s ease";
                newCard.style.transform = "translateY(30px)";
                newCard.style.opacity = "0";
                // 强制重绘
                newCard.offsetHeight;
                newCard.style.transform = "translateY(0)";
                newCard.style.opacity = "1";
            }
            isAnimating = false;
        }, 250);
    }

    // 渲染当前卡片（带动画重置）
    function renderCurrentSwipeCard(resetAnimation = false) {
        const card = getCurrentCard();
        if (!card) {
            swipeContainer.innerHTML = `<div style="text-align:center; padding:40px;">暂无数据</div>`;
            return;
        }
        const isFav = isFavorite(card.id);
        const newHtml = `
            <div class="swipe-card" style="transform: translateY(0); opacity: 1;">
                <div class="card-inner">
                    <div class="card-question">❓ ${escapeHtml(card.question)}</div>
                    <div class="card-answer">📝 ${escapeHtml(card.answer)}</div>
                    <div class="card-source">📌 ${escapeHtml(card.source || "佛经讲解")}</div>
                    <button class="swipe-fav-btn ${isFav ? 'active' : ''}" data-id="${card.id}">${isFav ? "❤️" : "🤍"}</button>
                </div>
            </div>
        `;
        swipeContainer.innerHTML = newHtml;
        const favBtn = swipeContainer.querySelector(".swipe-fav-btn");
        if (favBtn) {
            favBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                toggleFavorite(card.id);
                renderCurrentSwipeCard(); // 刷新按钮状态
            });
        }
        // 绑定双击收藏
        const cardInner = swipeContainer.querySelector(".card-inner");
        if (cardInner) {
            cardInner.addEventListener("dblclick", (e) => {
                e.stopPropagation();
                toggleFavorite(card.id);
                // 微动态：爱心微颤
                const btn = swipeContainer.querySelector(".swipe-fav-btn");
                if (btn) {
                    btn.style.transform = "scale(1.2)";
                    setTimeout(() => { if(btn) btn.style.transform = ""; }, 150);
                }
                renderCurrentSwipeCard();
            });
        }
    }

    // 提示小toast
    function showToast(msg, duration=1500) {
        let toast = document.querySelector(".custom-toast");
        if (!toast) {
            toast = document.createElement("div");
            toast.className = "custom-toast";
            toast.style.position = "fixed";
            toast.style.bottom = "100px";
            toast.style.left = "50%";
            toast.style.transform = "translateX(-50%)";
            toast.style.backgroundColor = "rgba(0,0,0,0.6)";
            toast.style.color = "white";
            toast.style.padding = "6px 16px";
            toast.style.borderRadius = "40px";
            toast.style.fontSize = "0.75rem";
            toast.style.zIndex = "1000";
            toast.style.backdropFilter = "blur(8px)";
            document.body.appendChild(toast);
        }
        toast.innerText = msg;
        toast.style.opacity = "1";
        setTimeout(() => { toast.style.opacity = "0"; }, duration);
    }

    // ---------- 5. 手势滑动逻辑 ----------
    let touchStartY = 0;
    let touchStartTime = 0;
    let isSwipingGesture = false;

    function onTouchStart(e) {
        if (currentDisplayMode !== "random") return;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
        isSwipingGesture = true;
        e.preventDefault();
    }
    function onTouchMove(e) {
        if (!isSwipingGesture || currentDisplayMode !== "random") return;
        e.preventDefault();
    }
    function onTouchEnd(e) {
        if (!isSwipingGesture || currentDisplayMode !== "random") {
            isSwipingGesture = false;
            return;
        }
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        const deltaTime = Date.now() - touchStartTime;
        if (Math.abs(deltaY) > 40 && deltaTime < 300) {
            if (deltaY < 0) {
                // 向上滑动 -> 下一张
                nextCard();
            } else if (deltaY > 0) {
                // 向下滑动也可切换（可选，为了符合直觉，也切换到下一张？但简讯通常向上下一张；这里统一向上下一张，向下不做处理）
                // 如果需要向下也下一张，可以取消注释；但为了自然，只向上切换。
                // 如果想要向下也切换，可以 nextCard();
            }
        }
        isSwipingGesture = false;
    }

    function bindSwipeEvents() {
        const container = document.getElementById("cardSwipeContainer");
        if (!container) return;
        container.removeEventListener("touchstart", onTouchStart);
        container.removeEventListener("touchmove", onTouchMove);
        container.removeEventListener("touchend", onTouchEnd);
        container.addEventListener("touchstart", onTouchStart, { passive: false });
        container.addEventListener("touchmove", onTouchMove, { passive: false });
        container.addEventListener("touchend", onTouchEnd);
    }

    // ---------- 6. 列表模式渲染（收藏/搜索/功课）----------
    function renderCards(cards) {
        cardsContainer.innerHTML = "";
        if (!cards || cards.length === 0) {
            cardsContainer.innerHTML = "<div style='text-align:center; padding:40px; color:#b8a88a;'>暂无内容</div>";
            return;
        }
        cards.forEach(card => {
            const div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `
                <div class="question">❓ ${escapeHtml(card.question)}</div>
                <div class="answer">📝 ${escapeHtml(card.answer)}</div>
                <div class="source" style="font-size:0.7rem; margin-top:8px;">📌 ${escapeHtml(card.source || "佛经讲解")}</div>
                <button class="fav-btn ${isFavorite(card.id) ? 'active' : ''}" data-id="${card.id}">${isFavorite(card.id) ? "❤️" : "🤍"}</button>
            `;
            div.querySelector(".fav-btn").addEventListener("click", (e) => {
                e.stopPropagation();
                toggleFavorite(card.id);
                renderCards(cards);
            });
            cardsContainer.appendChild(div);
        });
    }

    function renderFavorites() {
        const favCards = fullKnowledge.filter(c => isFavorite(c.id));
        renderCards(favCards);
        statusMsgDiv.innerHTML = favCards.length ? `⭐ 共 ${favCards.length} 条收藏` : "暂无收藏";
    }

    // 搜索
    function performSearch() {
        const keyword = document.getElementById("searchInput").value.trim();
        if (!keyword) { alert("请输入关键词"); return; }
        const lower = keyword.toLowerCase();
        const results = fullKnowledge.filter(c => 
            c.question.toLowerCase().includes(lower) || c.answer.toLowerCase().includes(lower)
        );
        searchResults = results;
        currentDisplayMode = "search";
        switchToListMode();
        renderCards(searchResults);
        statusMsgDiv.innerHTML = `🔍 找到 ${results.length} 条结果`;
        document.getElementById("clearSearchBtn").style.display = "inline-block";
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    }
    function exitSearch() {
        currentDisplayMode = "random";
        document.getElementById("searchInput").value = "";
        document.getElementById("clearSearchBtn").style.display = "none";
        switchToRandomMode();
        document.querySelector(".tab[data-mode='random']").classList.add("active");
    }

    // 功课
    function loadJournal() {
        const stored = localStorage.getItem("buddha_journal");
        if (stored) try { journalEntries = JSON.parse(stored); } catch(e) {}
        else journalEntries = [];
    }
    function saveJournal() { localStorage.setItem("buddha_journal", JSON.stringify(journalEntries)); }
    function getTodayDate() { return new Date().toISOString().slice(0,10); }
    function getTodayEntry() { return journalEntries.find(e => e.date === getTodayDate()); }
    function saveTodayEntry(text) {
        const today = getTodayDate();
        const idx = journalEntries.findIndex(e => e.date === today);
        if (idx >= 0) journalEntries[idx].text = text;
        else journalEntries.unshift({ date: today, text: text });
        saveJournal();
        renderJournalMode();
    }
    function updateJournalEntry(date, newText) {
        const idx = journalEntries.findIndex(e => e.date === date);
        if (idx >= 0) journalEntries[idx].text = newText;
        saveJournal();
        renderJournalMode();
    }
    function renderJournalMode() {
        cardsContainer.innerHTML = "";
        const today = getTodayDate();
        const todayEntry = getTodayEntry();
        const journalHTML = `
            <div class="journal-area">
                <div class="journal-date">📅 今日 · ${today}</div>
                <textarea id="journalText" class="journal-input" rows="3" placeholder="记录今日修行功课..."></textarea>
                <button id="saveJournalBtn" class="journal-save">保存今日记录</button>
            </div>
            <div class="journal-area">
                <div class="journal-date">📖 过往记录</div>
                <div id="historyList"></div>
            </div>
        `;
        cardsContainer.innerHTML = journalHTML;
        const textarea = document.getElementById("journalText");
        if (todayEntry) textarea.value = todayEntry.text;
        document.getElementById("saveJournalBtn").addEventListener("click", () => saveTodayEntry(textarea.value));
        const historyList = document.getElementById("historyList");
        const pastEntries = journalEntries.filter(e => e.date !== today).sort((a,b) => new Date(b.date) - new Date(a.date));
        if (!pastEntries.length) historyList.innerHTML = "<div style='color:#b8a88a; padding:8px;'>暂无历史记录</div>";
        else {
            pastEntries.forEach(entry => {
                const item = document.createElement("div");
                item.className = "history-item";
                item.innerHTML = `
                    <div class="history-date">${entry.date} <button class="edit-history" data-date="${entry.date}">编辑</button></div>
                    <div class="history-text">${escapeHtml(entry.text)}</div>
                `;
                item.querySelector(".edit-history").addEventListener("click", () => {
                    const newText = prompt("编辑修行记录", entry.text);
                    if (newText !== null) updateJournalEntry(entry.date, newText);
                });
                historyList.appendChild(item);
            });
        }
        statusMsgDiv.innerHTML = "";
    }

    // 模式切换
    function switchToRandomMode() {
        currentDisplayMode = "random";
        randomHeader.classList.remove("hidden");
        randomContent.classList.remove("hidden");
        listModeContainer.classList.add("hidden");
        // 确保队列有效
        if (randomQueue.length === 0 || currentCardIndex >= randomQueue.length) {
            rebuildRandomQueue();
            currentCardIndex = 0;
        }
        renderCurrentSwipeCard();
        bindSwipeEvents();
        // 绑定提示点击
        swipeHint.onclick = () => { if (currentDisplayMode === "random") nextCard(); };
    }
    function switchToListMode() {
        randomHeader.classList.add("hidden");
        randomContent.classList.add("hidden");
        listModeContainer.classList.remove("hidden");
    }
    function refreshCurrentView() {
        if (currentDisplayMode === "favorites") renderFavorites();
        else if (currentDisplayMode === "search") renderCards(searchResults);
        else if (currentDisplayMode === "journal") renderJournalMode();
        else if (currentDisplayMode === "random") renderCurrentSwipeCard();
    }

    function handleTabClick(mode) {
        if (mode === "random") {
            switchToRandomMode();
        } else if (mode === "favorites") {
            currentDisplayMode = "favorites";
            switchToListMode();
            renderFavorites();
        } else if (mode === "journal") {
            currentDisplayMode = "journal";
            switchToListMode();
            renderJournalMode();
        }
        document.querySelectorAll(".tab").forEach(tab => {
            if (tab.getAttribute("data-mode") === mode) tab.classList.add("active");
            else tab.classList.remove("active");
        });
        document.getElementById("clearSearchBtn").style.display = "none";
        document.getElementById("searchInput").value = "";
    }

    // 警醒语
    const wisdomQuotes = [
        "⏳ 是日已过，命亦随减，如少水鱼，斯有何乐？",
        "🔥 大众当勤精进，如救头燃，但念无常，慎勿放逸。",
        "🌅 每一天都是生命的倒计时，今日不修，更待何时？",
        "🧘 暇满人身难得，正法难遇，此刻不修，更待何时？",
        "⚡ 生死事大，无常迅速，各自努力，莫再蹉跎。"
    ];
    function setRandomWisdom() {
        const banner = document.getElementById("wisdomBanner");
        if (banner) banner.innerText = wisdomQuotes[Math.floor(Math.random() * wisdomQuotes.length)];
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m));
    }

    // 初始化
    function init() {
        loadFavorites();
        loadJournal();
        setRandomWisdom();
        rebuildRandomQueue();
        currentCardIndex = 0;
        switchToRandomMode();
        document.getElementById("searchBtn").addEventListener("click", performSearch);
        document.getElementById("clearSearchBtn").addEventListener("click", exitSearch);
        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => {
                const mode = tab.getAttribute("data-mode");
                if (mode) handleTabClick(mode);
            });
        });
    }
    init();
</script>
</body>
</html>
