<script>
// ===========================
// 配置
// ===========================
const SUPABASE_URL = "https://tzgmkqqtjnwgacipenmz.supabase.co";
const SUPABASE_KEY = "sb_publishable_pboaiePYU0TUqudEkNJHPw_hZE94vXo";
const TABLE = "cards";

// ===========================
// Supabase API 封装
// ===========================
async function dbSelect(params = "") {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}${params}`, {
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
        }
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
}

async function dbInsertBatch(rows) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
        method: "POST",
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
        },
        body: JSON.stringify(rows)
    });
    if (!res.ok) throw new Error(await res.text());
}

async function dbCount() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=id`, {
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Prefer": "count=exact",
            "Range": "0-0"
        }
    });
    const range = res.headers.get("content-range") || "";
    const match = range.match(/\/(\d+)/);
    return match ? Number(match[1]) : 0;
}

// ===========================
// 警句（本地）
// ===========================
const quotes = [
    "是日已过，命亦随减。",
    "生死事大，无常迅速。",
    "莫待老来方学道。",
    "但行好事，莫问前程。",
    "命由我作，福自己求。",
    "静坐常思己过，闲谈莫论人非。",
    "一切有为法，如梦幻泡影。",
    "过去心不可得，现在心不可得，未来心不可得。",
    "学如逆水行舟，不进则退。",
    "知行合一，事上磨练。",
    "人若改过，自有吉祥。",
    "凡事预则立，不预则废。"
];

// ===========================
// 状态
// ===========================
let cards = [];
let currentIndex = 0;

// ===========================
// 元素
// ===========================
const splashScreen  = document.getElementById("splash-screen");
const loadingScreen = document.getElementById("loading-screen");
const mainApp       = document.getElementById("main-app");
const quoteText     = document.getElementById("quote-text");
const enterBtn      = document.getElementById("enter-btn");
const cardContainer = document.getElementById("card-container");
const cardContent   = document.getElementById("card-content");
const bookLabel     = document.getElementById("bookLabel");
const cardCounter   = document.getElementById("card-counter");
const emptyState    = document.getElementById("empty-state");
const starBtn       = document.getElementById("starBtn");
const randomBtn     = document.getElementById("randomBtn");
const prevBtn       = document.getElementById("prevBtn");
const nextBtn       = document.getElementById("nextBtn");
const searchInput   = document.getElementById("searchInput");
const favBtn        = document.getElementById("favBtn");
const favPanel      = document.getElementById("fav-panel");
const favList       = document.getElementById("fav-list");
const closeFavBtn   = document.getElementById("closeFavBtn");
const searchPanel   = document.getElementById("search-panel");
const searchList    = document.getElementById("search-list");
const searchTitle   = document.getElementById("search-title");
const closeSearchBtn= document.getElementById("closeSearchBtn");
const adminBtn      = document.getElementById("adminBtn");
const adminPanel    = document.getElementById("admin-panel");
const closeAdminBtn = document.getElementById("closeAdminBtn");

// ===========================
// 开屏警句
// ===========================
quoteText.textContent = quotes[Math.floor(Math.random() * quotes.length)];

// ===========================
// 收藏：本地存储
// ===========================
function getFavs() {
    try { return JSON.parse(localStorage.getItem("favorites") || "[]"); }
    catch(e) { return []; }
}
function saveFavs(f) {
    try { localStorage.setItem("favorites", JSON.stringify(f)); } catch(e) {}
}
function isFav(card) {
    return getFavs().some(f => f.id === card.id);
}

// ===========================
// 渲染卡片
// ===========================
function renderCard() {
    if (cards.length === 0) {
        cardContainer.style.display = "none";
        emptyState.classList.add("show");
        cardCounter.textContent = "";
        return;
    }

    cardContainer.style.display = "flex";
    emptyState.classList.remove("show");

    if (currentIndex < 0) currentIndex = cards.length - 1;
    if (currentIndex >= cards.length) currentIndex = 0;

    const card = cards[currentIndex];
    bookLabel.textContent = card.book || "";
    cardContent.textContent = card.content || "";
    cardCounter.textContent = (currentIndex + 1) + " / " + cards.length;

    if (isFav(card)) {
        starBtn.textContent = "★";
        starBtn.classList.add("active");
    } else {
        starBtn.textContent = "☆";
        starBtn.classList.remove("active");
    }

    try { localStorage.setItem("reading-progress", currentIndex); } catch(e) {}
}

// ===========================
// 加载数据库卡片
// ===========================
async function loadCards() {
    loadingScreen.classList.add("show");
    try {
        // 分批加载，每次1000条
        let all = [];
        let from = 0;
        const batch = 1000;
        while (true) {
            const chunk = await dbSelect(`?select=id,book,content&order=id.asc&offset=${from}&limit=${batch}`);
            all = all.concat(chunk);
            if (chunk.length < batch) break;
            from += batch;
        }
        cards = all;

        // 恢复断点
        try {
            const saved = Number(localStorage.getItem("reading-progress") || 0);
            if (saved >= 0 && saved < cards.length) currentIndex = saved;
            else currentIndex = 0;
        } catch(e) { currentIndex = 0; }

    } catch(e) {
        cards = [];
        console.error("加载失败", e);
    }
    loadingScreen.classList.remove("show");
}

// ===========================
// 进入阅读
// ===========================
enterBtn.addEventListener("click", async () => {
    splashScreen.style.display = "none";
    mainApp.style.display = "flex";
    await loadCards();
    renderCard();
});

// ===========================
// 翻页
// ===========================
nextBtn.addEventListener("click", () => { currentIndex++; renderCard(); });
prevBtn.addEventListener("click", () => { currentIndex--; renderCard(); });
randomBtn.addEventListener("click", () => {
    if (cards.length === 0) return;
    currentIndex = Math.floor(Math.random() * cards.length);
    renderCard();
});

// ===========================
// 滑动手势
// ===========================
let tx = 0, ty = 0;
cardContainer.addEventListener("touchstart", e => {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
}, { passive: true });
cardContainer.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 40) { dx < 0 ? currentIndex++ : currentIndex--; renderCard(); }
    } else {
        if (Math.abs(dy) > 40) { dy < 0 ? currentIndex++ : currentIndex--; renderCard(); }
    }
}, { passive: true });

// ===========================
// 收藏
// ===========================
starBtn.addEventListener("click", () => {
    if (cards.length === 0) return;
    const card = cards[currentIndex];
    let favs = getFavs();
    if (isFav(card)) {
        favs = favs.filter(f => f.id !== card.id);
    } else {
        favs.push(card);
    }
    saveFavs(favs);
    renderCard();
});

favBtn.addEventListener("click", () => { renderFavPanel(); favPanel.classList.add("open"); });
closeFavBtn.addEventListener("click", () => favPanel.classList.remove("open"));

function renderFavPanel() {
    const favs = getFavs();
    favList.innerHTML = "";
    if (favs.length === 0) {
        favList.innerHTML = '<div class="empty-tip">还没有收藏<br>阅读时点击 ☆ 收藏卡片</div>';
        return;
    }
    favs.forEach(card => {
        const div = document.createElement("div");
        div.className = "fav-card";
        div.innerHTML = `
            <div class="book-label">${card.book || ""}</div>
            <div class="fav-content">${card.content || ""}</div>
            <button class="fav-remove" data-id="${card.id}">移除收藏</button>
        `;
        favList.appendChild(div);
    });
    favList.querySelectorAll(".fav-remove").forEach(btn => {
        btn.addEventListener("click", () => {
            const id = Number(btn.dataset.id);
            saveFavs(getFavs().filter(f => f.id !== id));
            renderFavPanel();
            renderCard();
        });
    });
}

// ===========================
// 搜索
// ===========================
searchInput.addEventListener("input", () => {
    const kw = searchInput.value.trim();
    if (!kw) { searchPanel.classList.remove("open"); return; }

    const results = cards.filter(c =>
        c.content.includes(kw) || (c.book && c.book.includes(kw))
    );
    searchTitle.textContent = `"${kw}"  ·  ${results.length} 条`;
    searchList.innerHTML = "";

    if (results.length === 0) {
        searchList.innerHTML = '<div class="empty-tip">未找到相关内容</div>';
    } else {
        results.forEach(card => {
            const div = document.createElement("div");
            div.className = "search-card";
            div.innerHTML = `
                <div class="book-label">${card.book || ""}</div>
                <div class="search-content">${card.content || ""}</div>
            `;
            div.addEventListener("click", () => {
                currentIndex = cards.findIndex(c => c.id === card.id);
                renderCard();
                searchPanel.classList.remove("open");
                searchInput.value = "";
            });
            searchList.appendChild(div);
        });
    }
    searchPanel.classList.add("open");
});
closeSearchBtn.addEventListener("click", () => {
    searchPanel.classList.remove("open");
    searchInput.value = "";
});

// ===========================
// 管理员面板
// ===========================
adminBtn.addEventListener("click", () => adminPanel.classList.add("open"));
closeAdminBtn.addEventListener("click", () => adminPanel.classList.remove("open"));

// 文件选择
const fileInput     = document.getElementById("file-input");
const uploadArea    = document.getElementById("upload-area");
const bookNameInput = document.getElementById("bookNameInput");
const chunkSizeInput= document.getElementById("chunkSizeInput");
const uploadBtn     = document.getElementById("uploadBtn");
const uploadLog     = document.getElementById("upload-log");
const checkDbBtn    = document.getElementById("checkDbBtn");
const dbStatus      = document.getElementById("db-status");

let selectedFile = null;

fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files[0];
    if (selectedFile) {
        uploadArea.innerHTML = `✅ 已选择：${selectedFile.name}<br><span style="font-size:12px;color:#bbb">点击重新选择</span>`;
        uploadBtn.disabled = false;
    }
});

// 切分文本：按段落切，段落太长再按字数切
function splitText(text, chunkSize) {
    const paras = text.split(/\n+/).map(p => p.trim()).filter(p => p.length > 0);
    const chunks = [];
    let current = "";

    for (const para of paras) {
        if (para.length >= chunkSize) {
            // 段落本身就超长，直接按字数切
            if (current.trim()) { chunks.push(current.trim()); current = ""; }
            for (let i = 0; i < para.length; i += chunkSize) {
                chunks.push(para.slice(i, i + chunkSize));
            }
        } else if ((current + "\n" + para).length > chunkSize) {
            if (current.trim()) chunks.push(current.trim());
            current = para;
        } else {
            current = current ? current + "\n" + para : para;
        }
    }
    if (current.trim()) chunks.push(current.trim());
    return chunks;
}

function log(msg, type = "") {
    const div = document.createElement("div");
    div.className = type;
    div.textContent = msg;
    uploadLog.appendChild(div);
    uploadLog.scrollTop = uploadLog.scrollHeight;
}

uploadBtn.addEventListener("click", async () => {
    if (!selectedFile) return;

    const bookName = bookNameInput.value.trim();
    if (!bookName) { alert("请先填写书名"); return; }

    const chunkSize = Math.max(50, Math.min(500, Number(chunkSizeInput.value) || 150));

    uploadBtn.disabled = true;
    uploadLog.innerHTML = "";
    log("正在读取文件…");

    const text = await selectedFile.text();
    const chunks = splitText(text, chunkSize);
    log(`共切出 ${chunks.length} 张卡片，开始上传…`);

    const batchSize = 100;
    let success = 0;

    for (let i = 0; i < chunks.length; i += batchSize) {
        const batch = chunks.slice(i, i + batchSize).map(content => ({
            book: bookName,
            content: content
        }));
        try {
            await dbInsertBatch(batch);
            success += batch.length;
            log(`已上传 ${success} / ${chunks.length} 张…`);
        } catch(e) {
            log(`上传出错（第${i}批）：${e.message}`, "log-err");
        }
    }

    log(`✅ 完成！共上传 ${success} 张卡片`, "log-ok");
    uploadBtn.disabled = false;

    // 重新加载卡片
    await loadCards();
    renderCard();
});

// 查看数量
checkDbBtn.addEventListener("click", async () => {
    dbStatus.textContent = "查询中…";
    try {
        const count = await dbCount();
        dbStatus.textContent = `数据库当前共有 ${count} 张卡片`;
    } catch(e) {
        dbStatus.textContent = "查询失败：" + e.message;
    }
});

</script>

</body>
</html>
